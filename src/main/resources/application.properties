spring.application.name=pocket_plant
spring.profiles.active=secret
server.port=8080

# FastAPI Configuration
fast.api.url=http://localhost:8000/predict


# OpenAI Configuration
ai.base-url=https://api.openai.com
ai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api-key=${OPENAI_API_KEY}


# ==========================================
# AWS RDS MySQL Configuration
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Small-instance defaults: keep DB connections and servlet threads bounded.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:6}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:24}
server.tomcat.threads.min-spare=2


##NAVER Mail Configuration
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com



# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-time=259200000


# Kakao API Configuration (Mobile API)
kakao.api.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.rest-api-key=${KAKAO_REST_API_KEY}





# ==========================================
# Plant API Configuration (??? ?? ? ??)
# ==========================================
plant-api.plantnet.url=https://my-api.plantnet.org/v2/identify/all
plant-api.plantnet.key=${PLANTNET_API_KEY}

plant-api.perenual.url=https://perenual.com/api/species-list
plant-api.perenual.key=${PERENUAL_API_KEY}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
