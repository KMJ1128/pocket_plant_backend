<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
    <style>
        .container { width: 300px; margin: 100px auto; font-family: sans-serif; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error-msg { color: red; font-size: 0.8em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>로그인</h2>

    <!-- 로그인 실패 시 에러 메시지 출력 -->
    <div th:if="${param.error}" class="error-msg">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 로그아웃 후 리다이렉트 되었을 때 메시지 -->
    <div th:if="${param.logout}" style="color: blue; margin-bottom: 10px;">
        로그아웃 되었습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit">로그인</button>
    </form>

    <hr>
    <p style="text-align: center;">계정이 없으신가요? <a href="/register">회원가입</a></p>
</div>

</body>
</html>
