<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>환영합니다</title>
    <style>
        .container { text-align: center; margin-top: 100px; font-family: sans-serif; }
        .user-info { color: #007bff; font-weight: bold; }
        .logout-btn { padding: 8px 16px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>축하합니다! 로그인에 성공하셨습니다.</h1>

    <!-- 현재 로그인한 사용자의 아이디를 출력합니다 -->
    <p>환영합니다, <span class="user-info" sec:authentication="name">사용자</span>님!</p>

    <br>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">로그아웃</button>
    </form>
</div>
</body>
</html>
